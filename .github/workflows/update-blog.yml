name: Update latest blog posts

on:
  schedule:
    - cron: "0 13 * * *" # Daily at 13:00 UTC (8/9 AM ET)
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-readme:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Sync latest posts from thatalexguy.dev
        run: python3 scripts/update_blog.py

      - name: Commit and push if changed
        run: |
          if git diff --quiet README.md; then
            echo "No changes to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md
          git commit -m "Update latest blog posts from thatalexguy.dev"
          git push
